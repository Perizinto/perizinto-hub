<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f8; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #000; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Set New Password</h2>
        <p id="status">Verifying link...</p>
        <input type="password" id="new-password" placeholder="New password" style="display:none;">
        <button id="reset-btn" style="display:none;" onclick="completeReset()">Reset Password</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBcSXio4XHKvWyeEPZncKgBt5ZR1fiKJ-4",
            authDomain: "perizinto-tailor-hub.firebaseapp.com",
            projectId: "perizinto-tailor-hub"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const oobCode = urlParams.get('oobCode');

        if (mode === 'resetPassword' && oobCode) {
            auth.verifyPasswordResetCode(oobCode)
                .then(email => {
                    document.getElementById('status').innerText = `Reset password for ${email}`;
                    document.getElementById('new-password').style.display = 'block';
                    document.getElementById('reset-btn').style.display = 'block';
                })
                .catch(err => {
                    document.getElementById('status').innerText = 'Link expired or invalid. Please request a new one.';
                });
        } else {
            document.getElementById('status').innerText = 'Invalid reset link.';
        }

        window.completeReset = () => {
            const newPassword = document.getElementById('new-password').value;
            if (!newPassword) return alert('Enter a new password.');
            auth.confirmPasswordReset(oobCode, newPassword)
                .then(() => {
                    document.getElementById('status').innerText = 'Password reset successful! You can now login.';
                    document.getElementById('new-password').style.display = 'none';
                    document.getElementById('reset-btn').style.display = 'none';
                })
                .catch(err => {
                    alert('Error: ' + err.message);
                });
        };
    </script>
</body>
</html>
